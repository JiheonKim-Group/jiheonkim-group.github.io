<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#265ba5"/>
    </marker>
    <!-- Pillars fade out as they reach up into the loop -->
    <linearGradient id="pillar-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3bf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f6e3bf" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="pillar-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a1e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c98a1e" stop-opacity="1"/>
    </linearGradient>
  </defs>


  <!-- Pillars: from the base up to the cards -->
  <g fill="url(#pillar-fill)" stroke="url(#pillar-stroke)" stroke-width="2">
    <rect x="120" y="250" width="150" height="140"/>
    <rect x="630" y="250" width="150" height="140"/>
  </g>

  <!-- Robot card -->
  <rect x="55" y="60" width="280" height="190" rx="16" fill="#e6eef8" stroke="#265ba5" stroke-width="2"/>
  <g stroke="#004191" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M160 166 H228"/>
    <path d="M194 166 V120 L234 88 V120"/>
    <path d="M225 120 V132 M243 120 V132"/>
  </g>
  <circle cx="194" cy="120" r="8" fill="#265ba5"/>
  <circle cx="234" cy="88" r="8" fill="#265ba5"/>
  <rect x="228" y="134" width="12" height="20" rx="3" fill="#b9dcf4" stroke="#004191" stroke-width="3"/>
  <text x="195" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#004191">Robotic</text>
  <text x="195" y="236" text-anchor="middle" font-size="26" font-weight="700" fill="#004191">experimentation</text>

  <!-- AI card -->
  <rect x="565" y="60" width="280" height="190" rx="16" fill="#e6eef8" stroke="#265ba5" stroke-width="2"/>
  <g stroke="#7fb3dc" stroke-width="2.5">
    <path d="M665 112 L705 92 M665 112 L705 130 M665 112 L705 168"/>
    <path d="M665 150 L705 92 M665 150 L705 130 M665 150 L705 168"/>
    <path d="M705 92 L745 112 M705 92 L745 150 M705 130 L745 112 M705 130 L745 150 M705 168 L745 112 M705 168 L745 150"/>
  </g>
  <g fill="#265ba5">
    <circle cx="665" cy="112" r="9"/><circle cx="665" cy="150" r="9"/>
    <circle cx="705" cy="92" r="9"/><circle cx="705" cy="130" r="9"/><circle cx="705" cy="168" r="9"/>
    <circle cx="745" cy="112" r="9"/><circle cx="745" cy="150" r="9"/>
  </g>
  <text x="705" y="206" text-anchor="middle" font-size="26" font-weight="700" fill="#004191">AI</text>
  <text x="705" y="236" text-anchor="middle" font-size="26" font-weight="700" fill="#004191">decision making</text>

  <!-- Loop between robot and AI -->
  <path d="M345 110 Q450 40 555 110" fill="none" stroke="#265ba5" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#265ba5">experimental data</text>
  <path d="M555 208 Q450 280 345 208" fill="none" stroke="#265ba5" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="282" text-anchor="middle" font-size="17" font-weight="600" fill="#265ba5">next experiment</text>

  <!-- Center -->
  <text x="450" y="146" text-anchor="middle" font-size="23" font-weight="700" fill="#004191">Materials</text>
  <text x="450" y="173" text-anchor="middle" font-size="23" font-weight="700" fill="#004191">&amp; Devices</text>
  <text x="450" y="198" text-anchor="middle" font-size="15" fill="#555">accelerated development</text>

  <!-- Pillar labels, centered on each pillar inside the loop box -->
  <text x="195" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#8a5c0c">shapes a robust,</text>
  <text x="195" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#8a5c0c">feasible platform</text>
  <text x="705" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#8a5c0c">refines &amp; guides</text>
  <text x="705" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#8a5c0c">AI decisions</text>

  <!-- Upward chevrons in the lower part of the pillars -->
  <g fill="none" stroke="#c98a1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M182 352 L195 338 L208 352 M182 378 L195 364 L208 378"/>
    <path d="M692 352 L705 338 L718 352 M692 378 L705 364 L718 378"/>
  </g>

  <!-- Between the pillars: the scientific question -->
  <text x="450" y="366" text-anchor="middle" font-size="20" font-weight="700" fill="#8a5c0c">Frames the scientific question worth pursuing</text>

  <!-- Human expertise base: the foundation stone, wider than everything above -->
  <rect x="10" y="390" width="880" height="124" rx="16" fill="#fdf3e1" stroke="#c98a1e" stroke-width="2"/>
  <circle cx="210" cy="440" r="18" fill="#c98a1e"/>
  <path d="M174 490 a36 36 0 0 1 72 0 z" fill="#c98a1e"/>
  <text x="480" y="452" text-anchor="middle" font-size="34" font-weight="700" fill="#8a5c0c">Human domain expertise</text>
  <text x="480" y="484" text-anchor="middle" font-size="19" fill="#6b4a10">experience · insight · dexterity · proven methods</text>
</svg>
